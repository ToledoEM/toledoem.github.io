<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px;
            line-height: 1.6;
            color: #333;
        }

        img {
            height: 300px;
            width: auto;
            margin-bottom: 30px;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <img src="https://toledoem.github.io/www/me.jpeg" alt="Profile">
    <h1>404</h1>
    <p>Page not found.</p>
    <p><a href="/">← Back to home</a></p>

    <!-- GoatCounter analytics - privacy friendly, no cookies -->
    <script
    data-goatcounter="https://etoledo.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js"
    ></script>
</body>
</html>
