<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Field</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

    <!-- ── Left panel: main controls ── -->
    <div class="controls-panel" id="sidebar">

        <h1>Flow Field</h1>
        <p class="subtitle">ToledoEM · MIT</p>

        <div class="step-nav" id="stepNav">
            <button class="step-btn active" onclick="setStep(1)">1 · Field</button>
            <button class="step-btn" onclick="setStep(2)">2 · Color</button>
            <button class="step-btn" onclick="setStep(3)">3 · Perturb</button>
        </div>

        <!-- ── STEP 1 ── -->
        <div data-step="1" class="control-section">
            <h3>Canvas</h3>

            <div class="control-group">
                <label for="aspectRatioSelect">Aspect Ratio <span class="value" id="aspectRatioValue">—</span></label>
                <select id="aspectRatioSelect"></select>
            </div>

            <div class="control-group">
                <label>Scale <span class="value" id="fieldScaleFactorValue">1.00</span></label>
                <input type="range" id="fieldScaleFactor" min="0.1" max="3" step="0.05" value="1">
            </div>

            <div class="control-group">
                <label>Offset X <span class="value" id="offsetXValue">0.00</span></label>
                <input type="range" id="offsetX" min="-1" max="1" step="0.01" value="0">
            </div>

            <div class="control-group">
                <label>Offset Y <span class="value" id="offsetYValue">0.00</span></label>
                <input type="range" id="offsetY" min="-1" max="1" step="0.01" value="0">
            </div>
        </div>

        <div data-step="1" class="control-section">
            <h3>Field</h3>

            <div class="control-group">
                <label for="fieldMethod">Method <span class="value" id="fieldMethodLabel">—</span></label>
                <select id="fieldMethod"></select>
            </div>

            <div class="control-group">
                <label for="fieldScale">Field Scale <span class="value" id="fieldScaleValue">0.005</span></label>
                <input type="range" id="fieldScale" min="0.001" max="0.05" step="0.001" value="0.005">
            </div>

            <div class="control-group">
                <label for="resolution">Resolution <span class="value" id="resolutionValue">30</span></label>
                <input type="range" id="resolution" min="10" max="100" step="5" value="30">
            </div>

            <div class="control-group">
                <label for="numPaths">Paths <span class="value" id="numPathsValue">500</span></label>
                <input type="range" id="numPaths" min="100" max="20000" step="50" value="500">
            </div>

            <div class="control-group">
                <label for="stepSize">Step Size <span class="value" id="stepSizeValue">4.0</span></label>
                <input type="range" id="stepSize" min="1" max="20" step="0.5" value="4">
            </div>

            <div class="control-group">
                <label for="strokeWeight">Stroke Weight <span class="value" id="strokeWeightValue">0.5</span></label>
                <input type="range" id="strokeWeight" min="0.1" max="3" step="0.1" value="0.5">
            </div>
        </div>

        <div data-step="1" class="control-section">
            <h3>Seed</h3>
            <div class="control-group">
                <label for="seedInput">Seed value <span class="value" id="seedValue">Auto</span></label>
                <input type="number" id="seedInput" placeholder="Enter seed (blank = random)">
            </div>
            <div class="button-group row">
                <button class="secondary" onclick="randomizeSeed()">Random Seed</button>
            </div>
        </div>

        <div data-step="1" class="control-section">
            <h3>Generate</h3>
            <div class="checkbox-group">
                <input type="checkbox" id="autoRegenerate">
                <label for="autoRegenerate">Auto Regenerate</label>
            </div>
            <div class="button-group">
                <button onclick="regenerate()">Regenerate <small style="opacity:.7;font-weight:400;">(R)</small></button>
            </div>
        </div>

        <div data-step="1" class="control-section">
            <h3>Export</h3>
            <div class="button-group">
                <button class="secondary" onclick="downloadSVG()">Download SVG</button>
                <button class="secondary" onclick="downloadCSV()">Download CSV</button>
                <button class="secondary" onclick="downloadJSON()">Download JSON</button>
                <button class="secondary" onclick="downloadPNG()">Download PNG</button>
                <button class="secondary" onclick="uploadJSON()">Import JSON</button>
                <button class="secondary" onclick="downloadZIP()">Download ZIP</button>
            </div>
        </div>

        <!-- ── STEP 2 ── -->
        <div data-step="2" id="colorUIContainer"></div>

        <!-- ── STEP 3 ── -->
        <div data-step="3" id="perturbUIContainer"></div>

        <div class="info-box">
            <div>Flow Field · ToledoEM</div>
            <div>MIT License</div>
        </div>

    </div><!-- end controls-panel -->

    <!-- ── Canvas area ── -->
    <div class="canvas-panel">
        <div id="canvasContainer">
            <div id="progressOverlay">
                <div id="progressBarContainer">
                    <div id="progressBar">0%</div>
                </div>
                <button id="cancelBtn" onclick="cancelGeneration()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ── Right panel: method params ── -->
    <div id="methodPanel">
        <h3>Method Params</h3>
        <div id="dynamicParams"></div>
        <div style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(143,166,160,0.12);">
            <small style="color:#718096; font-size:10px; line-height:1.5;">Press <strong>R</strong> to regenerate.</small>
        </div>
    </div>

</div><!-- end .container -->

<script src="libraries/fflate.min.js"></script>
<script src="libraries/p5.min.js"></script>
<script src="libraries/field-methods.js"></script>
<script src="libraries/export-utils.js"></script>
<script src="libraries/path-trace-core.js"></script>
<script src="libraries/palettes.js"></script>
<script src="libraries/color-methods.js"></script>
<script src="libraries/perturbation-methods.js"></script>
<script src="libraries/flowfields.js"></script>
</body>
</html>
