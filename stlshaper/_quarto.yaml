project:
  type: website
  output-dir: _site
  render:
    - documentation.qmd

site-url: "https://toledoem.github.io/stlShaper/"

website:
  title: "STLShaper - 3D Mesh Deformation"
  navbar:
    background: primary
    title: "STLShaper"
    left:
      - text: "Documentation"
        href: documentation.qmd
    right:
      - icon: github
        href: "https://github.com/ToledoEM/stlShaper"
        aria-label: "GitHub repository"
  page-footer:
    left: "MIT License · [ToledoEM](https://github.com/ToledoEM)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: flatly
    css: documentation-styles.css
    toc: true
    toc-location: left
    toc-depth: 3
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    include-in-header:
      text: |
        <script data-goatcounter="https://etoledo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
